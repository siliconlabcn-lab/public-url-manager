<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公开网址</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f6f8fa; color: #1f2328; }
    main { width: min(680px, calc(100% - 40px)); padding: 48px; box-sizing: border-box; text-align: center; background: white; border: 1px solid #d0d7de; border-radius: 16px; box-shadow: 0 8px 24px rgba(140,149,159,.2); }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 7vw, 56px); }
    p { margin: 0; color: #59636e; font-size: 18px; line-height: 1.7; }
    a { color: #0969da; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #f0f6fc; }
      main { background: #161b22; border-color: #30363d; box-shadow: none; }
      p { color: #9198a1; }
      a { color: #4493f8; }
    }
  </style>
</head>
<body>
  <main>
    <h1>公开网址已启动</h1>
    <p>这是由 GitHub Pages 托管的公开页面，任何人都可以通过这个网址访问。</p>
  </main>
</body>
</html>
